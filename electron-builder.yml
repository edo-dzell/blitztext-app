appId: de.blitztext.app
productName: Blitztext

directories:
  output: release
  buildResources: build

files:
  - out/**
  - package.json
  # Produktive node_modules (electron-builder filtert devDependencies automatisch heraus). Nötig,
  # weil der Main-Prozess externe Laufzeit-Deps lädt (uiohook-napi, ADR-0002) — electron-vite
  # externalisiert sie statt sie zu bündeln.
  - node_modules/**

# Native Module aus dem asar auspacken, sonst nicht ladbar. uiohook-napi ist N-API mit prebuilds:
# dist/index.js ruft `node-gyp-build(join(__dirname,'..'))`, das zur Laufzeit die passende
# prebuilds/<platform>-<arch>/*.node dlopent (s. npmRebuild:false, keine from-source-Kompilierung).
# Nur die .node-Binärdatei MUSS auf die echte Platte (dlopen kann nicht aus dem asar laden); JS wird
# problemlos aus dem asar geladen. Das Build-Target ist ausschließlich win32-x64 → nur dessen Prebuild
# entpacken (verifizierte Struktur: prebuilds/win32-x64/uiohook-napi.node). Spart die 6 fremden
# Plattform-Prebuilds (darwin/linux/win32-arm64), die auf Windows-x64 nie geladen werden.
asarUnpack:
  - node_modules/uiohook-napi/prebuilds/win32-x64/**

extraResources:
  - from: resources
    to: .

# uiohook-napi bringt fertige win32-Binaries mit (prebuilds, N-API/ABI-stabil). @electron/rebuild
# würde sonst from-source cross-kompilieren wollen — das kann node-gyp auf Linux nicht. Mit den
# Prebuilds bleibt das v1-zip auf Linux baubar (ADR-0006).
npmRebuild: false

# Portable, unsigniert (ADR-0006). Zielgruppe: kleines internes Team auf bekannten Maschinen.
# Nutzer-Regel (2026-06-14): IMMER eine fertige portable .exe ausliefern (nicht das zip) — eine
# einzelne, selbst-entpackende Datei, win-paste.exe steckt als extraResource darin (resourcesPath).
# Das portable-Target baut auf Linux OHNE wine. Deckt sich mit dem CI-Release
# (.github/workflows/release.yml: `electron-builder --win portable`).
win:
  target:
    - portable
  artifactName: ${productName}-${version}-win-portable.${ext}
  # Unsigniert (ADR-0006), ABER mit eingestempeltem Icon und Versions-Metadaten.
  #
  # Bis v0.7.x stand hier `signAndEditExecutable: false`. Diese Option schaltet BEIDES ab — das
  # Signieren UND das Resource-Editing (rcedit), das build/icon.ico sowie ProductName/Version in die
  # .exe schreibt. Damals war das nötig, weil rcedit auf Linux wine verlangte; die sichtbare Folge war
  # das Electron-Standardicon in Taskleiste und Explorer, obwohl das Tray-Icon korrekt war.
  #
  # Mit electron-builder 26 gilt das nicht mehr: `signExecutable: false` überspringt NUR das
  # Signieren, das Resource-Editing läuft — und zwar auf Linux ohne wine. Verifiziert am 2026-07-31
  # gegen 26.15.3: die gebaute .exe enthält die Bilddaten aus icon.ico sowie "Blitztext"/"0.7.3.0"
  # als ProductName/FileDescription. Der Build-Log sagt dann "file signing skipped via
  # signExecutable configuration" statt "resource editing and code signing skipped".
  signExecutable: false

# nsis-Installer + Code-Signierung = v2/RMM (ADR-0005, #09), in v1 bewusst nicht aktiv:
# nsis:
#   oneClick: false        # Installationsumfang waehlbar; unbeaufsichtigt: Setup.exe /S /allusers
#   perMachine: false
#   allowElevation: true
#   allowToChangeInstallationDirectory: true
